[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-predict"
version = "0.2.0"
description = "Multi-factor quantitative trading system for U.S. equities with Alpaca integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Zhaochen Wu", email = "zhaochenwu666@gmail.com" },
]
keywords = ["quantitative-finance", "trading", "alpaca", "machine-learning", "factor-models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # see requirements.txt for the pinned runtime set
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.3.0",
    "mypy>=1.10.0",
]

[project.urls]
Documentation = "docs/"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "research/venv",
    "venv",
    "**/__pycache__",
    "research/legacy",
    "catboost_info",
    "research/**/catboost_info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length is enforced by formatter
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = "research/(venv|legacy)|catboost_info"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = "research/(venv|legacy)|catboost_info"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: tests that hit external services (Alpaca, Finnhub)",
    "slow: tests that take more than a few seconds",
]
