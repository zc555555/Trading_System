name: tests

# Every push/PR runs the leakage guards, evaluation math, no-debt principle
# pins, risk-model additivity and macro-snapshot freeze tests. These are
# the structural guarantees the research report leans on; CI makes them a
# gate nobody (including future me) can skip.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install lean test dependencies
        run: pip install -r requirements-ci.txt
      - name: Run test suite
        run: python -m pytest tests/ -q
