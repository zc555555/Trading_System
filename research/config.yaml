    - market_breadth_1d  # % of stocks up today
    - market_breadth_5d  # % of stocks up in last 5 days

# Label settings (UPDATED - Direction 2: predict 1 day instead of 3)
label:
  horizon: 1  # Future return horizon (days) - CHANGED FROM 3 TO 1
  type: "classification"  # "classification" or "regression"
  cost_buffer: 0.001  # 10 bps total cost (lower for 1-day holding)

# Regression label for price prediction (NEW - for accurate price forecast)
label_regression:
  horizon: 1  # Predict tomorrow's closing price
  type: "regression"
  target: "next_day_return"  # Predict actual return percentage

# Backtest settings
backtest:
  initial_capital: 100000

  # Walk-forward parameters
  train_window: 756  # ~3 years
  test_window: 63    # ~3 months
  step_size: 21      # ~1 month

  # Costs
  commission: 0.0005  # 5 bps
  slippage: 0.001     # 10 bps

  # Position constraints
  max_position_size: 0.35  # Max 35% per stock
  max_total_leverage: 1.0  # Long-only (100% max invested)

# Model settings (UPDATED - Multiple models for ensemble)
model:
  type: "ensemble"  # Use ensemble of multiple models for maximum accuracy

  xgboost:
    n_estimators: 500           # Increased from 300
    max_depth: 6                # Increased from 5
    learning_rate: 0.03         # Decreased from 0.05 for better generalization
    subsample: 0.7              # More aggressive sampling
    colsample_bytree: 0.7       # More aggressive feature sampling
    min_child_weight: 3         # Added regularization
    gamma: 0.1                  # Added complexity penalty
    scale_pos_weight: 1.2       # Handle class imbalance
    random_state: 42

  lightgbm:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.03
    num_leaves: 31              # 2^depth - 1
    feature_fraction: 0.7       # Similar to colsample_bytree
    bagging_fraction: 0.7       # Similar to subsample
    bagging_freq: 5
    min_child_samples: 20       # Similar to min_child_weight
    lambda_l1: 0.1              # L1 regularization
    lambda_l2: 0.1              # L2 regularization
    random_state: 42

  catboost:
    iterations: 500
    depth: 6
    learning_rate: 0.03
    l2_leaf_reg: 3              # L2 regularization
    bagging_temperature: 0.7    # Similar to subsample
    random_strength: 0.1        # Randomness for scoring splits
    border_count: 128           # Number of splits for numerical features
    random_state: 42
    verbose: False

  # Ensemble settings
  ensemble:
    method: "weighted_average"  # or "stacking"
    weights:
      xgboost: 0.35
      lightgbm: 0.35
      catboost: 0.30

  # Factor blending (W2-A upgrade, 2026-05).
  # How to combine the 6 factor-level ensemble predictions into one signal.
  #
  #   static          : Use hand-tuned weights from factor_definitions.FACTOR_WEIGHTS.
  #                     Use this only if you have a strong prior. Ignored after universe changes.
  #   ic_proportional : Read each factor's out-of-sample validation IC, clip negatives, normalize.
  #                     Linear in IC -- a 5x stronger factor gets 5x the weight.
  #                     Good when ICs are similar magnitude.
  #   ic_sqrt         : Same idea but weight by sqrt(max(IC, 0)). DAMPENS the spread between
  #                     strong and weak factors. CURRENT DEFAULT after W2-A multi-horizon training
  #                     pushed momentum IC to 0.65 -- ic_proportional would give momentum 88%
  #                     weight (too concentrated). ic_sqrt gives a more diversified 45-50%.
  #   ic_squared      : max(IC, 0)^2 -- amplifies the strongest factor. Use only when one factor
  #                     is dominant and you want to concentrate exposure.
  factor_weighting:
    strategy: "ic_sqrt"
    floor: 0.0                  # Factors with IC at or below this get zero weight
    fallback_to_static: true    # If all factors are below floor, use static weights

  # Export settings
  onnx_output: "model.onnx"
  manifest_output: "feature_manifest.json"
  thresholds_output: "thresholds.json"
  golden_vectors_output: "golden_vectors.json"
