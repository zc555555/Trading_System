
# Research Configuration

# Data settings
data:
  # Universe selection (W1 upgrade - 2026-05).
  # Resolved at fetch time by research/data/universe.py.
  #   sp100       : ~100 mega-caps (offline-safe)
  #   sp500_safe  : sp100 + ~150 high-conviction large/mid-caps (offline-safe)
  #   sp500       : Live Wikipedia fetch (current S&P 500 constituents)
  #   benchmarks  : Broad + sector ETFs only
  #   all         : sp500 + benchmarks (production default)
  universe: "sp500_safe"

  # Whether to include benchmark / sector ETFs alongside the equity universe.
  # ETFs are useful as alternative tradables AND as a stability anchor.
  include_benchmark_etfs: true

  # Legacy explicit symbol list. If set (non-null), OVERRIDES `universe`.
  # Kept here as a rollback escape hatch — leave null in production.
  symbols: null

  # Liquidity filter applied AFTER raw fetch (see apply_liquidity_filter.py).
  # Stocks failing this filter are dropped from training & prediction.
  liquidity_filter:
    enabled: true
    min_dollar_volume_20d: 50000000   # $50M average daily $-volume over 20d
    min_price: 5.0                    # Drop penny stocks
    min_history_days: 252             # Require >= 1 year of data

  # 2026-07: extended back from 2018-01-01 so the walk-forward gains
  # ~4 years of never-evaluated folds (virgin test data for new factors).
  # NOTE: universe is CURRENT constituents applied to all history --
  # survivorship bias grows with lookback; affects all variants equally.
  start_date: "2014-01-01"
  end_date: null  # null = today

  parquet_path: "stocks.parquet"

